<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kintore-checker demo</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-2: #262a32;
    --text: #e8eaee;
    --muted: #949cab;
    --accent: #4ec9a5;
    --accent-ink: #0d1512;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }

  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
    max-width: 560px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
  }

  h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .badge {
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
  }

  .card { background: var(--panel); border-radius: 16px; padding: 14px; margin-bottom: 14px; }

  .prog { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
  .prog-n { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.3rem; }
  .prog-n small { font-weight: 400; font-size: 0.78rem; color: var(--muted); margin-left: 3px; }
  .prog-sub { font-size: 0.76rem; color: var(--muted); text-align: right; }

  .stage { position: relative; border-radius: 12px; overflow: hidden; background: var(--panel-2); }
  .stage svg.art { display: block; width: 100%; height: auto; }
  .tiles { position: absolute; inset: 0; display: grid; pointer-events: none; }
  .tile { background: var(--panel-2); transition: opacity 500ms ease; }
  .tile.open { opacity: 0; }
  .done-banner {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 14px;
    background: rgba(20,22,26,0.88);
    font-size: 0.85rem; text-align: center;
  }

  .move-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .move-name { font-weight: 500; font-size: 0.93rem; }
  .move-note { font-size: 0.72rem; color: var(--muted); }
  .move-n { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; flex: none; }
  .move-n small { font-weight: 400; font-size: 0.74rem; color: var(--muted); }

  .ctl { display: flex; gap: 6px; }
  .ctl button { border-radius: 10px; background: var(--panel-2); padding: 12px 0; font-size: 0.88rem; font-weight: 500; }
  .ctl .minus { width: 52px; color: var(--muted); }
  .ctl .plus { flex: 1; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .ctl .set { width: 92px; }
  .ctl button:disabled { opacity: 0.32; }
  .ctl button:active:not(:disabled) { filter: brightness(1.18); }

  .hint { font-size: 0.78rem; color: var(--muted); line-height: 1.75; margin: 0; }
  .hint b { color: var(--text); font-weight: 500; }

  .reset { display: block; width: 100%; padding: 11px; border-radius: 10px; background: var(--panel-2); text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>kintore-checker</h1>
  <span class="badge">DEMO</span>
</div>

<section class="card">
  <div class="prog">
    <div class="prog-n" id="progN">0<small>/ 60</small></div>
    <div class="prog-sub" id="progSub">—</div>
  </div>
  <div class="stage" id="stage">
    <svg class="art" viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg" aria-label="デモ用の仮画像">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a1b4d"/>
          <stop offset="45%" stop-color="#8e3d6b"/>
          <stop offset="72%" stop-color="#e2705a"/>
          <stop offset="100%" stop-color="#f6b263"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e09a5c"/>
          <stop offset="100%" stop-color="#2d1f42"/>
        </linearGradient>
      </defs>
      <rect width="600" height="750" fill="url(#sky)"/>
      <circle cx="300" cy="455" r="92" fill="#ffd98a"/>
      <g fill="#ffffff" opacity="0.85">
        <circle cx="92" cy="78" r="2.4"/><circle cx="188" cy="140" r="1.7"/>
        <circle cx="286" cy="62" r="2"/><circle cx="402" cy="122" r="2.6"/>
        <circle cx="498" cy="70" r="1.8"/><circle cx="540" cy="186" r="2.1"/>
        <circle cx="60" cy="210" r="1.6"/><circle cx="352" cy="196" r="1.5"/>
      </g>
      <g fill="#2b1c3f">
        <path d="M0 470 L128 322 L214 424 L286 350 L392 470 Z"/>
        <path d="M300 470 L398 336 L470 410 L534 352 L600 470 Z"/>
      </g>
      <g fill="#442a5c">
        <path d="M0 500 L96 404 L206 500 Z"/>
        <path d="M398 500 L500 398 L600 500 Z"/>
      </g>
      <rect y="500" width="600" height="250" fill="url(#sea)"/>
      <g fill="#ffd98a" opacity="0.5">
        <rect x="262" y="520" width="76" height="7" rx="3.5"/>
        <rect x="248" y="546" width="104" height="6" rx="3"/>
        <rect x="270" y="572" width="60" height="5" rx="2.5"/>
        <rect x="238" y="598" width="124" height="6" rx="3"/>
        <rect x="278" y="626" width="44" height="4" rx="2"/>
        <rect x="252" y="652" width="96" height="5" rx="2.5"/>
      </g>
      <g fill="#1a1028">
        <path d="M0 690 L70 660 L150 700 L232 668 L318 704 L410 666 L502 702 L600 672 L600 750 L0 750 Z"/>
      </g>
    </svg>
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<section class="card">
  <div class="move-top">
    <div>
      <div class="move-name">スクワット</div>
      <div class="move-note">椅子に座って立つ動作から</div>
    </div>
    <div class="move-n" id="moveN">0<small> / 10</small></div>
  </div>
  <div class="ctl">
    <button class="minus" id="minus">−1</button>
    <button class="plus" id="plus">+1</button>
    <button class="set" id="set">+10</button>
  </div>
  <button class="reset" id="reset">最初に戻す</button>
</section>

<p class="hint">
  <b>+1 を押すごとに、目隠しが1マス開きます。</b>
  <b>+10</b> はセットが終わったあとにまとめて入れる用で、10マスが順に開きます。
  本番では複数の種目が並び、その日のメニューの回数までしか押せません。
</p>

<script>
(function () {
  "use strict";

  var TOTAL = 60;
  var COLS = 6;
  var TARGET = 10;
  var reps = 0;

  function order(total) {
    var seed = 20260921;
    var arr = [];
    for (var j = 0; j < total; j++) arr.push(j);
    for (var k = total - 1; k > 0; k--) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      var m = seed % (k + 1);
      var t = arr[k]; arr[k] = arr[m]; arr[m] = t;
    }
    return arr;
  }

  var ORD = order(TOTAL);
  var POS = new Array(TOTAL);
  for (var q = 0; q < TOTAL; q++) POS[ORD[q]] = q;

  var tiles = document.getElementById("tiles");
  tiles.style.gridTemplateColumns = "repeat(" + COLS + ",1fr)";
  tiles.style.gridTemplateRows = "repeat(" + (TOTAL / COLS) + ",1fr)";
  var html = "";
  for (var i = 0; i < TOTAL; i++) html += '<div class="tile"></div>';
  tiles.innerHTML = html;

  var last = 0;

  function render() {
    var n = Math.min(reps, TOTAL);
    var open = {};
    for (var i = 0; i < n; i++) open[ORD[i]] = true;

    for (var j = 0; j < TOTAL; j++) {
      var el = tiles.children[j];
      if (n > last && !el.classList.contains("open") && open[j]) {
        el.style.transitionDelay = Math.min((POS[j] - last) * 70, 1400) + "ms";
      } else {
        el.style.transitionDelay = "0ms";
      }
      el.classList.toggle("open", !!open[j]);
    }
    last = n;

    var banner = document.querySelector(".done-banner");
    if (n >= TOTAL) {
      if (!banner) {
        banner = document.createElement("div");
        banner.className = "done-banner";
        banner.textContent = "完成しました";
        document.getElementById("stage").appendChild(banner);
      }
    } else if (banner) {
      banner.remove();
    }

    document.getElementById("progN").innerHTML = n + '<small>/ ' + TOTAL + "</small>";
    document.getElementById("progSub").textContent =
      n >= TOTAL ? "開ききりました" : "あと " + (TOTAL - n) + " レップで完成";

    var shown = Math.min(reps, TARGET);
    document.getElementById("moveN").innerHTML = shown + "<small> / " + TARGET + "</small>";
    document.getElementById("minus").disabled = reps <= 0;
    document.getElementById("plus").disabled = reps >= TOTAL;
    document.getElementById("set").disabled = reps >= TOTAL;
  }

  document.getElementById("plus").addEventListener("click", function () {
    reps = Math.min(reps + 1, TOTAL); render();
  });
  document.getElementById("set").addEventListener("click", function () {
    reps = Math.min(reps + TARGET, TOTAL); render();
  });
  document.getElementById("minus").addEventListener("click", function () {
    reps = Math.max(reps - 1, 0); render();
  });
  document.getElementById("reset").addEventListener("click", function () {
    reps = 0; last = 0; render();
  });

  render();
})();
</script>
</body>
</html>
